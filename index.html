<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로펌잡 - 변호사 채용 공고</title>
  <style>
    :root {
      --green: #158765;
      --green-soft: #E6F5EF;
      --orange: #D97706;
      --orange-soft: #FEF3E2;
      --blue: #2563EB;
      --blue-soft: #E5F1FB;
      --red: #DC2626;
      --gray: #6B7280;
      --gray-soft: #F3F4F6;
      --text: #111827;
      --text-sub: #6B7280;
      --border: #E5E7EB;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Pretendard", "Malgun Gothic", "맑은 고딕", sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      max-width: 720px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--bg);
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0;
      color: var(--text);
      margin: 0;
    }

    .logo .accent {
      color: var(--green);
    }

    .admin-toggle {
      display: none;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 8px 11px;
      font-size: 13px;
      font-weight: 700;
    }

    .admin-entry .admin-toggle {
      display: inline-flex;
    }

    .tabs,
    .sort-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 18px 0;
    }

    .sort-bar {
      padding-top: 8px;
      padding-bottom: 10px;
    }

    .tab-btn,
    .sort-btn {
      flex: 0 0 auto;
      padding: 8px 13px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
    }

    .tab-btn.active,
    .sort-btn.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    .admin-panel {
      display: none;
      margin: 6px 16px 12px;
      padding: 14px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 8px;
    }

    .admin-panel.open {
      display: block;
    }

    .admin-title {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 800;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
      background: #fff;
      color: var(--text);
    }

    .field textarea {
      min-height: 76px;
      resize: vertical;
    }

    .admin-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .primary-btn,
    .secondary-btn,
    .link-btn {
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      text-align: center;
    }

    .primary-btn {
      border: 1px solid var(--green);
      background: var(--green);
      color: #fff;
    }

    .secondary-btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
    }

    .link-btn {
      display: block;
      border: 1px solid var(--green);
      background: var(--green);
      color: #fff;
    }

    .job-list {
      padding: 6px 16px 44px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .card-top,
    .meta-row,
    .stage-row,
    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .card-top {
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .firm {
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 700;
    }

    .source-badge,
    .dday,
    .stage-badge {
      font-size: 12px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 7px;
    }

    .source-badge.seoulbar {
      background: #EEF2FF;
      color: #3730A3;
    }

    .source-badge.jobcenter {
      background: #ECFDF5;
      color: #047857;
    }

    .dday.active {
      background: var(--green-soft);
      color: var(--green);
    }

    .dday.urgent {
      background: #FEE2E2;
      color: var(--red);
    }

    .dday.closed {
      background: var(--gray-soft);
      color: var(--text-sub);
    }

    .title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
      margin: 0 0 10px;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .meta-row {
      color: var(--text-sub);
      font-size: 13px;
      margin-bottom: 10px;
    }

    .stage-row {
      margin: 10px 0 12px;
      padding: 10px;
      background: var(--gray-soft);
      border-radius: 8px;
    }

    .stage-badge.interview {
      background: var(--blue-soft);
      color: var(--blue);
    }

    .stage-badge.done {
      background: var(--green-soft);
      color: var(--green);
    }

    .stage-checked {
      font-size: 12px;
      color: var(--text-sub);
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 7px 10px;
      padding-top: 4px;
      margin-bottom: 12px;
      font-size: 13px;
    }

    .detail-grid dt {
      color: var(--text-sub);
      font-weight: 800;
    }

    .detail-grid dd {
      margin: 0;
      color: var(--text);
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .admin-stage {
      display: none;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .admin-mode .admin-stage {
      display: grid;
    }

    .empty {
      text-align: center;
      padding: 56px 20px;
      color: var(--text-sub);
      font-size: 14px;
    }

    @media (max-width: 560px) {
      .admin-grid,
      .admin-stage {
        grid-template-columns: 1fr;
      }

      .admin-actions {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="header">
      <div class="header-row">
        <h1 class="logo">로<span class="accent">펌</span>잡</h1>
        <button class="admin-toggle" type="button" id="admin-toggle">관리자 로그인</button>
      </div>
    </header>

    <section class="admin-panel" id="admin-panel">
      <h2 class="admin-title">공고 추가</h2>
      <form id="posting-form" class="admin-grid">
        <div class="field">
          <label for="source">구분</label>
          <select id="source" name="source">
            <option value="seoulbar">서울지방변호사회</option>
            <option value="jobcenter">취업정보센터</option>
          </select>
        </div>
        <div class="field">
          <label for="stage">채용 단계</label>
          <select id="stage" name="stage">
            <option value="interview">면접 진행 중</option>
            <option value="done">채용 완료</option>
          </select>
        </div>
        <div class="field">
          <label for="firm">로펌명</label>
          <input id="firm" name="firm" required />
        </div>
        <div class="field">
          <label for="title">제목</label>
          <input id="title" name="title" required />
        </div>
        <div class="field">
          <label for="postedAt">등록일</label>
          <input id="postedAt" name="postedAt" type="date" required />
        </div>
        <div class="field">
          <label for="deadline">마감일</label>
          <input id="deadline" name="deadline" type="date" required />
        </div>
        <div class="field source-field">
          <label for="location">위치</label>
          <input id="location" name="location" />
        </div>
        <div class="field source-field">
          <label for="salary">급여</label>
          <input id="salary" name="salary" />
        </div>
        <div class="field source-field">
          <label for="workHours">근무시간</label>
          <input id="workHours" name="workHours" />
        </div>
        <div class="field source-field">
          <label for="applicationEmail">지원 이메일</label>
          <input id="applicationEmail" name="applicationEmail" type="email" />
        </div>
        <div class="field source-field full">
          <label for="description">기타 설명</label>
          <textarea id="description" name="description"></textarea>
        </div>
        <div class="field link-field full">
          <label for="externalUrl">취업정보센터 게시글 링크</label>
          <input id="externalUrl" name="externalUrl" type="url" />
        </div>
        <div class="admin-actions field full">
          <button class="primary-btn" type="submit">공고 추가</button>
          <button class="secondary-btn" type="button" id="reset-local">임시 변경 초기화</button>
        </div>
      </form>
    </section>

    <nav class="tabs" aria-label="공고 출처">
      <button class="tab-btn active" type="button" data-source="all">전체</button>
      <button class="tab-btn" type="button" data-source="seoulbar">서울지방변호사회</button>
      <button class="tab-btn" type="button" data-source="jobcenter">취업정보센터</button>
    </nav>

    <div class="sort-bar">
      <button class="sort-btn active" type="button" data-sort="recent">최신순</button>
      <button class="sort-btn" type="button" data-sort="deadline">마감일순</button>
    </div>

    <main class="job-list" id="job-list"></main>
  </div>

  <script src="data.js"></script>
  <script>
    const STAGE_LABELS = {
      interview: "면접 진행 중",
      done: "채용 완료"
    };

    const SOURCE_LABELS = {
      seoulbar: "서울지방변호사회",
      jobcenter: "취업정보센터"
    };

    const ADMIN_PASSCODE = "lawjob-admin-2026";
    const ADMIN_QUERY = new URLSearchParams(window.location.search).get("admin") === "1";
    const ADMIN_SESSION_KEY = "lawjob-admin-auth";
    const STORAGE_KEY = "lawjob-postings-v2";
    const TODAY = new Date(new Date().toISOString().slice(0, 10));

    const state = {
      source: "all",
      sort: "recent",
      admin: ADMIN_QUERY && sessionStorage.getItem(ADMIN_SESSION_KEY) === "1",
      postings: loadPostings()
    };

    function parseDate(str) {
      return new Date(str || "2999-12-31");
    }

    function todayString() {
      return new Date().toISOString().slice(0, 10);
    }

    function nowString() {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function loadPostings() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return normalizePostings([...POSTINGS]);
      try {
        return normalizePostings(JSON.parse(saved));
      } catch {
        return normalizePostings([...POSTINGS]);
      }
    }

    function normalizePostings(postings) {
      return postings.map((posting) => ({
        ...posting,
        stage: posting.stage === "done" ? "done" : "interview"
      }));
    }

    function savePostings() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.postings));
    }

    async function syncPostingsFromServer() {
      try {
        const response = await fetch("/api/postings", { cache: "no-store" });
        if (!response.ok) return false;
        const data = await response.json();
        state.postings = normalizePostings(data.postings || []);
        savePostings();
        render();
        return true;
      } catch {
        return false;
      }
    }

    async function postJson(url, payload) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error("Server update failed");
      }

      const data = await response.json();
      state.postings = normalizePostings(data.postings || state.postings);
      savePostings();
      render();
    }

    function diffDays(target) {
      const ms = parseDate(target) - TODAY;
      return Math.ceil(ms / (1000 * 60 * 60 * 24));
    }

    function formatDeadline(str) {
      const d = parseDate(str);
      const days = ["일", "월", "화", "수", "목", "금", "토"];
      return `${d.getMonth() + 1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
    }

    function ddayLabel(deadline) {
      const d = diffDays(deadline);
      if (d > 0) return { text: `D-${d}`, cls: d <= 3 ? "urgent" : "active" };
      if (d === 0) return { text: "D-DAY", cls: "urgent" };
      return { text: "마감", cls: "closed" };
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getVisibleDetails(p) {
      const fields = [
        ["위치", p.location],
        ["급여", p.salary],
        ["근무시간", p.workHours],
        ["지원 이메일", p.applicationEmail],
        ["모집 부문", p.jobType],
        ["자격 요건", p.requirements],
        ["근무 시작일", p.startDate],
        ["전형 절차", p.process],
        ["제출 서류", p.documents],
        ["복지", p.benefits],
        ["홈페이지", p.homepage],
        ["기타", p.description]
      ];

      const rows = fields
        .filter(([, value]) => value)
        .map(([label, value]) => `<dt>${label}</dt><dd>${escapeHtml(value)}</dd>`)
        .join("");

      return rows ? `<dl class="detail-grid">${rows}</dl>` : "";
    }

    function renderCard(p) {
      const dd = ddayLabel(p.deadline);
      const stageKey = p.stage || "interview";
      const normalizedStage = STAGE_LABELS[stageKey] ? stageKey : "interview";
      const checked = p.stageCheckedAt ? `${p.stageCheckedAt} 확인` : "확인 시간 미상";
      const isJobcenter = p.source === "jobcenter";
      const details = isJobcenter ? "" : getVisibleDetails(p);
      const action = isJobcenter
        ? `<a class="link-btn" href="${escapeHtml(p.externalUrl || "#")}" target="_blank" rel="noopener">게시글 열기</a>`
        : p.applicationEmail
          ? `<a class="link-btn" href="mailto:${escapeHtml(p.applicationEmail)}">이메일 지원</a>`
          : "";

      return `
        <article class="card" data-id="${p.id}">
          <div class="card-top">
            <div>
              <span class="firm">${escapeHtml(p.firm)}</span>
              <span class="source-badge ${p.source}">${SOURCE_LABELS[p.source]}</span>
            </div>
            <span class="dday ${dd.cls}">${dd.text}</span>
          </div>
          <h2 class="title">${escapeHtml(p.title)}</h2>
          <div class="meta-row">
            <span>등록 ${escapeHtml(p.postedAt)}</span>
            <span>마감 ${formatDeadline(p.deadline)}</span>
          </div>
          <div class="stage-row">
            <span class="stage-badge ${normalizedStage}">${STAGE_LABELS[normalizedStage]}</span>
            <span class="stage-checked">${checked}</span>
          </div>
          ${details}
          <div class="card-actions">${action}</div>
          <div class="admin-stage">
            <select data-stage-select="${p.id}">
              ${Object.entries(STAGE_LABELS).map(([key, label]) => (
                `<option value="${key}" ${key === normalizedStage ? "selected" : ""}>${label}</option>`
              )).join("")}
            </select>
            <input data-stage-time="${p.id}" value="${escapeHtml(p.stageCheckedAt || nowString())}" />
            <button class="secondary-btn" type="button" data-stage-save="${p.id}">단계 저장</button>
          </div>
        </article>
      `;
    }

    function sortPostings(list) {
      const arr = [...list];
      if (state.sort === "deadline") {
        arr.sort((a, b) => parseDate(a.deadline) - parseDate(b.deadline));
      } else {
        arr.sort((a, b) => parseDate(b.postedAt) - parseDate(a.postedAt));
      }
      return arr;
    }

    function filteredPostings() {
      const list = state.source === "all"
        ? state.postings
        : state.postings.filter((p) => p.source === state.source);
      return sortPostings(list);
    }

    function render() {
      const app = document.getElementById("app");
      app.classList.toggle("admin-entry", ADMIN_QUERY);
      app.classList.toggle("admin-mode", state.admin);
      document.getElementById("admin-panel").classList.toggle("open", state.admin);
      document.getElementById("admin-toggle").textContent = state.admin ? "관리자 종료" : "관리자 로그인";

      const root = document.getElementById("job-list");
      const list = filteredPostings();
      root.innerHTML = list.length
        ? list.map(renderCard).join("")
        : `<div class="empty">등록된 공고가 없습니다.</div>`;
    }

    async function addPosting(form) {
      const data = Object.fromEntries(new FormData(form).entries());
      const nextId = Math.max(0, ...state.postings.map((p) => Number(p.id))) + 1;
      const posting = {
        id: nextId,
        source: data.source,
        firm: data.firm.trim(),
        title: data.title.trim(),
        postedAt: data.postedAt,
        deadline: data.deadline,
        stage: data.stage,
        stageCheckedAt: nowString()
      };

      if (data.source === "jobcenter") {
        posting.externalUrl = data.externalUrl.trim();
      } else {
        posting.location = data.location.trim();
        posting.salary = data.salary.trim();
        posting.workHours = data.workHours.trim();
        posting.applicationEmail = data.applicationEmail.trim();
        posting.description = data.description.trim();
      }

      state.postings.push(posting);
      savePostings();
      try {
        await postJson("/api/postings", posting);
      } catch {
        render();
      }
      form.reset();
      setDefaultDates();
      syncSourceFields();
      render();
    }

    async function updateStage(id) {
      const posting = state.postings.find((p) => Number(p.id) === Number(id));
      if (!posting) return;
      const stage = document.querySelector(`[data-stage-select="${id}"]`).value;
      const time = document.querySelector(`[data-stage-time="${id}"]`).value.trim();
      posting.stage = stage;
      posting.stageCheckedAt = time || nowString();
      savePostings();
      render();
      try {
        await postJson("/api/stages", {
          id: posting.id,
          stage: posting.stage,
          stageCheckedAt: posting.stageCheckedAt
        });
      } catch {
        render();
      }
    }

    function setDefaultDates() {
      document.getElementById("postedAt").value = todayString();
      document.getElementById("deadline").value = todayString();
    }

    function syncSourceFields() {
      const isJobcenter = document.getElementById("source").value === "jobcenter";
      document.querySelectorAll(".source-field").forEach((el) => {
        el.style.display = isJobcenter ? "none" : "flex";
      });
      document.querySelector(".link-field").style.display = isJobcenter ? "flex" : "none";
      document.getElementById("externalUrl").required = isJobcenter;
    }

    function authenticateAdmin() {
      if (!ADMIN_QUERY) return false;
      if (sessionStorage.getItem(ADMIN_SESSION_KEY) === "1") return true;

      const input = window.prompt("관리자 비밀번호를 입력하세요.");
      if (input !== ADMIN_PASSCODE) {
        window.alert("관리자 비밀번호가 일치하지 않습니다.");
        return false;
      }

      sessionStorage.setItem(ADMIN_SESSION_KEY, "1");
      return true;
    }

    document.getElementById("admin-toggle").addEventListener("click", () => {
      if (state.admin) {
        sessionStorage.removeItem(ADMIN_SESSION_KEY);
        state.admin = false;
        render();
        return;
      }

      if (!authenticateAdmin()) return;
      state.admin = true;
      render();
    });

    document.getElementById("posting-form").addEventListener("submit", (event) => {
      event.preventDefault();
      addPosting(event.currentTarget);
    });

    document.getElementById("source").addEventListener("change", syncSourceFields);

    document.getElementById("reset-local").addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      state.postings = [...POSTINGS];
      render();
    });

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        state.source = btn.dataset.source;
        render();
      });
    });

    document.querySelectorAll(".sort-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".sort-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        state.sort = btn.dataset.sort;
        render();
      });
    });

    document.getElementById("job-list").addEventListener("click", (event) => {
      const button = event.target.closest("[data-stage-save]");
      if (!button) return;
      updateStage(button.dataset.stageSave);
    });

    window.addEventListener("storage", (event) => {
      if (event.key !== STORAGE_KEY) return;
      state.postings = loadPostings();
      render();
    });

    setDefaultDates();
    syncSourceFields();
    savePostings();
    render();
    syncPostingsFromServer();
    window.setInterval(syncPostingsFromServer, 3000);
  </script>
</body>
</html>
